name: build-docs

on:
  release:
    types: [published]
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "mlx_cluster/**"
      - "bindings.cpp"
      - ".github/workflows/publish_docs.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build mlx_cluster (CPU-only, enough for the API page)
        # the API page reads the docstrings of the C++ extension from the
        # installed package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mlx[cpu]>=0.32" numpy "setuptools>=70.1" wheel nanobind==3.1.0 "cmake>=3.27"
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Install the docs dependencies
        run: |
          python -m pip install $(python -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['docs']))")
      - name: Build the site (Zensical, strict)
        run: zensical build --strict --clean
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
