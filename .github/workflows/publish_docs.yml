name: build-sphinx-docs

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build mlx_cluster (CPU-only, enough for docs)
        run: |
          python -m pip install "mlx[cpu]>=0.32" numpy "setuptools>=70.1" wheel nanobind==3.1.0 "cmake>=3.27"
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Install docs dependencies
        run: |
          python -m pip install "ipython==8.21.0" "sphinx>=7.2.6" "sphinx-book-theme==1.1.0" \
            "sphinx-autodoc-typehints==1.25.2" "nbsphinx==0.9.3" "sphinx-gallery==0.15.0"
          python -m pip install --no-deps "mlx-graphs>=0.0.8"
      - name: Build sphinx
        run: cd docs && make html
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4   # unchanged        
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
