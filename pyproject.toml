[project]
name = "mlx_cluster"
version = "0.1.5"
authors = [
  { name = "Vinay Pandya", email = "vinayharshadpandya27@gmail.com" },
]
description = "C++ extension for generating random graphs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mlx>=0.32.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
]

[project.optional-dependencies]
dev = []
docs = [
  # the documentation site (zensical.toml, docs/), same tools as mlx-graphs.
  # The API page inspects the compiled extension: build mlx_cluster first.
  "zensical==0.1.3",
  "mkdocstrings==1.0.8",
  "mkdocstrings-python==2.0.11",
  "griffe==2.4.1",
  "mkdocs-autorefs==1.4.5",
  "pymdown-extensions==13.1.2",
  "ruff==0.14.6",  # formats the signatures (separate_signature)
]

test = [
  "mlx-graphs>=0.0.8",
  "torch>=2.2.0",
  "mlx<=0.32",
  "pytest==7.4.4",
  "scipy>=1.13.0",
  "requests==2.31.0",
  "fsspec[http]==2024.2.0",
  "tqdm==4.66.1",
]

[project.urls]
Homepage = "https://github.com/mlx-graphs/mlx_cluster"
Documentation = "https://mlx-graphs.github.io/mlx_cluster/"
Repository = "https://github.com/mlx-graphs/mlx_cluster"
Issues = "https://github.com/mlx-graphs/mlx_cluster/issues"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "slow: marks tests that download data, compile kernels, or are otherwise time-consuming (deselect with -m 'not slow')",
]

[build-system]
requires = [
  "nanobind==3.1.0",
  "setuptools>=42",
  "cmake>=3.24",
  "mlx>=0.32.0", 
]

build-backend = "setuptools.build_meta"
